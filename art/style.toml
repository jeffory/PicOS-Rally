# PicOS Rally — locked palette. seed 20260726.
# 48 colors, indices 0-47 of the 256-entry CLUT. Every shipped asset is
# snapped to these by tools/palettize.py (no dithering — PixelLab output is
# already pixel art). Indices 48-255 are derived at load: for each locked
# color, 4 shade steps (-20%, -10%, +10%, +20% brightness, clamped) fill
# 48*4=192 entries 48-239; 240-254 reserved (per-stage accents); 255 =
# transparent (sprite mask key, never drawn).
#
# CLUT layout used by core/gfx.c:
#   idx = base           → the locked color
#   idx = 48 + base*4+0  → -20%
#   idx = 48 + base*4+1  → -10%
#   idx = 48 + base*4+2  → +10%
#   idx = 48 + base*4+3  → +20%

[palette]
seed = 20260726

# terrain greens (0-5)
scrub_deep    = "#2E4A2B"
grass_mid     = "#4A6B35"
grass_dry     = "#7A8B4A"
spinifex      = "#9AA055"
cane_green    = "#5E7A3A"
dune_grass    = "#8B9460"

# gravel / red ochre (6-10)
