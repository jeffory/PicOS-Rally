name: Install ARM toolchain
description: >
  Install a SHA256-pinned ARM GNU Toolchain and add it to PATH. This file is
  the single source of truth for the toolchain version; both ci.yml and
  release.yml consume it so they cannot drift onto different compilers.

runs:
  using: composite
  steps:
    - name: Resolve pinned version
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "ARM_TOOLCHAIN_VERSION=14.3.rel1"
          echo "ARM_TOOLCHAIN_SHA256=8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd"
        } >> "$GITHUB_ENV"

    - name: Cache ARM toolchain
      id: toolchain-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/toolchain
        # Both the version and the hash are in the key. Version alone would
        # collide across a checksum bump with no version change (unlikely);
        # hash alone (the previous key) means a version bump with a stale
        # cache entry restores the OLD compiler silently, since the download
        # step below is skipped entirely on a cache hit.
        key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ env.ARM_TOOLCHAIN_SHA256 }}

    - name: Download and verify
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        name="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi"
        url="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/${name}.tar.xz"
        curl -fsSL --max-time 300 "$url" -o /tmp/arm-toolchain.tar.xz
        # Fails closed on any mismatch, before anything is extracted.
        echo "${ARM_TOOLCHAIN_SHA256}  /tmp/arm-toolchain.tar.xz" | sha256sum -c -
        mkdir -p "$HOME/toolchain"
        tar -xf /tmp/arm-toolchain.tar.xz -C "$HOME/toolchain" --strip-components=1
        rm /tmp/arm-toolchain.tar.xz

    - name: Add to PATH
      shell: bash
      run: echo "$HOME/toolchain/bin" >> "$GITHUB_PATH"

    - name: Verify installed version matches the pin
      # On a cache hit the download/checksum step above never runs, so this
      # is what actually proves a cache hit did not silently hand back a
      # stale compiler from before a version bump. Case-insensitive because
      # ARM prints "14.3.Rel1" (capital R) while the pin holds "14.3.rel1".
      shell: bash
      run: |
        set -euo pipefail
        arm-none-eabi-gcc --version | grep -iF "$ARM_TOOLCHAIN_VERSION"
